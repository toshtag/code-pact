id: P87
name: Deterministic CI and Release
weight: 1
confidence: high
risk: low
status: in_progress
objective: >
  Make release and CI behavior deterministic, hermetic, and context-efficient.
  P87-T1 closes release correctness gaps; P87-T2 applies change-aware test
  selection; P87-T3 closes the verification-efficiency regression so focused
  plans actually run in PR CI and local edit/fix loops cannot repeat full
  suites.
non_goals:
  - Modify v2.8.0 tag/Release/npm package
  - Change production features outside the release pipeline
definition_of_done:
  - Trusted publishing fails closed on existing-version collisions
  - npm provenance attestation is verified before GitHub Release creation
  - Publish workflow does not depend on ambient git identity
  - Supply-chain invariants enforce the release contract
  - Pull-request verification uses deterministic focused selection with full
    fallback
  - Main commits run one full standard gate
  - Publish reuses the successful exact-SHA main CI result
  - Verification processes are bounded and expose heartbeat and slowest-file
    output
  - Pull-request CI executes the generated focused plan while high-risk changes
    and main pushes retain one full gate
  - Local verification requires a successful focused run before full
    verification and bounds full-suite attempts to two
verification:
  commands:
    - pnpm check:supply-chain
    - pnpm typecheck
    - pnpm test:unit -- --no-file-parallelism --testTimeout=30000
    - pnpm build
    - pnpm test:integration:smoke -- --no-file-parallelism --testTimeout=30000
    - pnpm check:docs
    - git diff --check
tasks:
  - id: P87-T1
    type: bugfix
    ambiguity: low
    risk: low
    context_size: medium
    write_surface: medium
    verification_strength: strong
    expected_duration: medium
    status: done
    description: >
      Ensure a normal release follows a strict, fail-closed contract: signed tag
      → exact commit verification → new npm version → build/pack → Trusted
      Publishing → registry integrity → provenance verification → GitHub
      Release.
    acceptance_refs:
      - tests/unit/scripts/check-release-tag.test.ts
      - tests/unit/scripts/verify-published-provenance.test.ts
      - tests/unit/workflows/publish-workflow.test.ts
      - tests/unit/scripts/check-supply-chain-invariants.test.ts
      - tests/helpers/git-repository.ts
  - id: P87-T2
    type: feature
    ambiguity: medium
    risk: low
    context_size: large
    write_surface: medium
    verification_strength: medium
    expected_duration: medium
    status: done
    description: >
      Change-aware, bounded, observable test execution. Add changed-file based
      test selection, hard timeouts with process-tree kill, a test heartbeat,
      and slowest-file reporting so the suite cannot hang silently and release
      verification does not repeat a full gate on the same commit.
    depends_on:
      - P87-T1
    reads:
