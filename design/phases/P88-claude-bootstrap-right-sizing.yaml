    definition_of_done:
      - The generated bootstrap names no project path the generator does not own
      - The generated repository gotcha holds for every code-pact-managed project
      - The generated bootstrap presents `data.more.command` before any external
        reference
      - The generated bootstrap makes no claim that `task prepare` points at the
        envelope reference
      - The generated bootstrap records the installed command's structured output
        as authoritative over the online reference
      - Adapter doctor describes `--accept-modified` as discarding local
        modifications, for both the schema-v1 and the schema-v2 drift signal
      - The current CLI contract documentation matches those overwrite semantics
      - Both locales stay within the bootstrap context budget
