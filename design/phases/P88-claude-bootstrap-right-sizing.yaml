  - id: P88-T1A
    type: bugfix
    ambiguity: low
    risk: low
    context_size: small
    write_surface: low
    verification_strength: strong
    expected_duration: short
    status: planned
    requires_decision: false
    description: >
      Correct the schema-v2 bootstrap's generated references and the
      adapter-doctor remediation text. The bootstrap names a scaffolded project
      path the generator cannot guarantee survives, and tells the agent to wait
      for a work-order pointer that `task prepare` never emits. Doctor describes
      `--accept-modified` as preserving local edits when it discards them.
