id: P88
name: Claude Bootstrap Right-Sizing
weight: 1
confidence: high
risk: medium
status: in_progress
objective: >
  Make the generated claude-code instruction file a bootstrap rather than a
  manual. The always-loaded file carries the repository purpose, the single
  per-task entrypoint, and a bounded set of non-obvious repository gotchas;
  every lifecycle, verification, failure, and model detail is disclosed through
  `task prepare` output and the envelope reference instead. The existing
  adapter-schema-v1 conformance contract stays in force for the adapters that
  still generate the full instruction file, so no installed adapter changes
  behavior until it is upgraded.
non_goals:
  - Change the `task prepare` output contract or any command envelope
  - Thin the codex, cursor, gemini-cli, or generic instruction templates
  - Migrate generated skills to a `<name>/SKILL.md` layout
  - Branch the generated instruction file on model id or model version
definition_of_done:
  - The claude-code adapter declares adapter schema version 2
  - Adapter conformance selects its instruction-file contract from the manifest
    adapter schema version, so schema-v1 installs keep the existing checks
  - The generated claude-code instruction file presents `task prepare` as the
    per-task entrypoint and names the progressive-disclosure fields the agent
    reads from it
  - The generated claude-code instruction file stays within the bootstrap
    context budget
  - The generated claude-code instruction file enumerates no lifecycle verb set,
    no failure catalog, and no model selection guidance
  - The repository-gotcha section of the generated claude-code instruction file
    is bounded
  - The generated claude-code instruction file is identical for every supported
    Claude model version
  - The Claude model catalog carries the Claude 5 model ids for validation,
    profile seeding, and advisory defaults
verification:
  commands:
    - pnpm typecheck
    - pnpm test:unit -- --no-file-parallelism --testTimeout=30000
    - pnpm build
    - pnpm test:integration:smoke -- --no-file-parallelism --testTimeout=30000
    - pnpm check:docs
    - git diff --check
tasks:
