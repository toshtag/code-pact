    requires_decision: false
    depends_on:
      - P89-T1F
  - id: P89-T3
    type: bugfix
    ambiguity: low
    risk: low
    context_size: small
    write_surface: low
    verification_strength: strong
    expected_duration: short
    status: planned
    description: >
