      - tests/unit/commands/task-lock.test.ts
      - tests/unit/core/contract-lock.test.ts
      - tests/unit/commands/task-add.test.ts
  - id: P90-T0B
    type: feature
    ambiguity: medium
    risk: high
    context_size: large
    write_surface: high
    verification_strength: strong
    expected_duration: long
    status: planned
    description: >
      Migrate the repository's own task fixtures behind a single test-only
      review-contract helper, add a project-level review_contract_policy of
      advisory or required so an existing plan is not made unlockable by the
      upgrade, and activate the missing-contract refusal in task lock and in the
      task start auto-lock. Publish TASK_REVIEW_CONTRACT_REQUIRED with structured
      JSON and human-readable CLI output, and switch this repository to
      required. The declared read/write scope and this task's own review contract
      are settled at its planning commit, before it is locked.
    requires_decision: false
    depends_on:
      - P90-T0A
    reads:
      - src/core/project.ts
      - src/core/verification-policy.ts
      - src/core/decisions/retention.ts
      - src/core/review-contract.ts
      - src/core/schemas/review-contract.ts
      - src/core/schemas/task.ts
      - src/core/plan/checks/review-contract.ts
      - src/commands/task-lock.ts
      - src/commands/task-progress.ts
      - tests/unit/core/review-contract.test.ts
      - tests/helpers/cli.ts
      - .code-pact/project.yaml
    writes:
      - src/core/schemas/project.ts
      - src/core/review-contract-policy.ts
      - src/core/contract-lock.ts
      - src/commands/init.ts
      - src/cli/commands/task-lock.ts
      - src/cli/commands/task.ts
      - tests/helpers/review-contract.ts
      - tests/unit/helpers/review-contract.test.ts
      - tests/unit/core/review-contract-policy.test.ts
      - tests/unit/core/contract-lock.test.ts
      - tests/unit/core/review-bundle.test.ts
      - tests/unit/commands/task-lock.test.ts
      - tests/unit/commands/task-finalize.test.ts
      - tests/unit/commands/review-bundle.test.ts
      - tests/unit/commands/init.test.ts
      - tests/unit/cli/review-contract-errors.test.ts
      - tests/unit/error-code-surface.test.ts
      - tests/integration/helpers/execute-once.ts
      - tests/integration/review-contract-policy.test.ts
      - tests/integration/ci-parity.test.ts
      - tests/integration/cli-aliases.test.ts
      - tests/integration/cli.test.ts
      - tests/integration/completion-cause-code.test.ts
      - tests/integration/e2e-workflow.test.ts
      - tests/integration/evidence-agent-detail.test.ts
      - tests/integration/json-stdout.test.ts
      - tests/integration/migration.test.ts
      - tests/integration/review-bundle.test.ts
      - tests/integration/task-context-budget.test.ts
      - tests/integration/task-execute-cli.test.ts
      - tests/integration/task-finalize-audit-strict.test.ts
      - tests/integration/task-finalize-write-audit.test.ts
      - tests/integration/task-lock.test.ts
      - tests/integration/task-prepare-commands-contract.test.ts
      - tests/integration/task-registration-spec.test.ts
      - tests/integration/task-start-dependency-gate.test.ts
      - docs/review-contract.md
      - docs/cli-contract.md
    acceptance_refs:
      - tests/unit/core/contract-lock.test.ts
      - tests/unit/cli/review-contract-errors.test.ts
      - tests/unit/commands/init.test.ts
      - tests/unit/commands/task-lock.test.ts
    review_contract:
      version: 1
      mode: boundary
      stages:
        - stage: producer
          disposition: in_scope
          claim: >
            init writes an explicit review_contract_policy of required into a
            freshly generated project.yaml, and one shared test-only helper
            builds valid review contracts for migrated fixtures whose contract
            is not itself the subject under test.
          refs:
            - src/commands/init.ts
            - tests/helpers/review-contract.ts
            - .code-pact/project.yaml
        - stage: consumer
          disposition: in_scope
          claim: >
            The project schema accepts advisory and required and rejects any
            other value, and the runtime resolver reads an absent field as
            advisory so an existing project keeps its current behavior.
          refs:
            - src/core/schemas/project.ts
            - src/core/review-contract-policy.ts
        - stage: runner
          disposition: in_scope
          claim: >
            Explicit task lock and the task start auto-lock share one refusal
            point. JSON mode emits the same TASK_REVIEW_CONTRACT_REQUIRED
            envelope with the task id and effective policy, while human mode
            emits the same actionable refusal message; both paths exit 2.
          refs:
            - src/core/contract-lock.ts
            - src/cli/commands/task-lock.ts
            - src/cli/commands/task.ts
        - stage: os
          disposition: not_applicable
          rationale: >
            Policy resolution and the refusal compare declared YAML against the
            task declaration. No filesystem layout, process launch, or platform
            API is involved, so no operating system can decide the outcome
            differently.
        - stage: security
          disposition: in_scope
          claim: >
            The refusal is fail-closed: under required policy a task with no
            contract leaves no lock file and no progress event behind, and an
            out-of-enum policy value fails project validation rather than
            silently degrading to advisory.
          refs:
            - src/core/contract-lock.ts
            - tests/integration/review-contract-policy.test.ts
      platforms:
        - platform: linux
          disposition: required
          level: integration
          refs:
            - tests/integration/review-contract-policy.test.ts
        - platform: macos
          disposition: not_required
          rationale: >
            The change adds no macOS-specific behavior; the policy decision is
            the same pure comparison the Linux integration run already proves.
        - platform: windows
          disposition: not_required
          rationale: >
            The change adds no Windows-specific behavior; no path handling,
            process launch, or line-ending semantics are touched.
      evidence:
        - id: policy-resolution
          claim: >
            An absent field resolves to advisory, a declared value is honoured,
            and an unknown value is refused by the project schema.
          level: unit
          refs:
            - tests/unit/core/review-contract-policy.test.ts
        - id: explicit-lock-refusal
          claim: >
            Under required policy a task with no review contract is refused and
            no lock file is written, while a valid contract still locks.
          level: unit
          refs:
            - tests/unit/core/contract-lock.test.ts
            - tests/unit/commands/task-lock.test.ts
        - id: start-auto-lock-refusal
          claim: >
            The task start auto-lock is refused under the same policy through a
            real CLI process, leaving no lock file and no started event.
          level: integration
          refs:
            - tests/integration/review-contract-policy.test.ts
        - id: cli-error-envelope
          claim: >
            Both JSON refusal surfaces emit TASK_REVIEW_CONTRACT_REQUIRED with
            the task id and effective policy. Their human-readable paths emit an
            actionable message naming the task and required policy instead of
            falling through to an internal error.
          level: unit
          refs:
            - tests/unit/cli/review-contract-errors.test.ts
            - tests/unit/error-code-surface.test.ts
        - id: fresh-init-policy
          claim: >
            A freshly initialized project declares required and its generated
            sample task still locks against that policy.
          level: unit
          refs:
            - tests/unit/commands/init.test.ts
        - id: fixture-helper-boundary
          claim: >
            One shared helper builds validator-accepted contracts for migrated
            non-contract-focused fixtures, refuses a task whose scope cannot
            back a contract, and is never imported by production code.
          level: unit
          refs:
            - tests/unit/helpers/review-contract.test.ts
        - id: migrated-integration-fixtures
          claim: >
            The shared execute-once boundary and the contract-capable task-lock
            integration fixtures run under required with generated contracts.
            Dedicated policy tests prove the absent, advisory, and required
            rollout behavior, while intentionally historical or scope-less
            fixtures explicitly remain advisory.
          level: integration
          refs:
            - tests/integration/helpers/execute-once.ts
            - tests/integration/task-lock.test.ts
            - tests/integration/review-contract-policy.test.ts
  - id: P90-T1
    type: feature
    ambiguity: medium
    risk: high
    context_size: large
    write_surface: medium
    verification_strength: strong
    expected_duration: long
    status: planned
    description: >
      Check a locked review contract against what verification actually
      recorded: every declared evidence entry must be backed by a recorded
      verification run, and every required platform must be proven at the
      declared level before a task can be completed. Publish the unmet entries
      as a structured refusal so an agent can see which claim has no proof
      behind it, rather than discovering it in review.
    requires_decision: false
    depends_on:
      - P90-T0B
    reads:
      - src/core/review-contract.ts
      - src/core/schemas/review-contract.ts
      - src/core/contract-lock.ts
      - src/core/verification-ledger.ts
      - src/core/verification-policy.ts
      - src/commands/task-record-done.ts
      - src/cli/commands/task.ts
    writes:
      - src/core/review-contract-evidence.ts
      - src/commands/task-complete.ts
      - src/cli/commands/task.ts
      - tests/unit/core/review-contract-evidence.test.ts
      - tests/unit/commands/task-complete.test.ts
      - tests/unit/error-code-surface.test.ts
      - tests/integration/review-contract-evidence.test.ts
      - docs/review-contract.md
      - docs/cli-contract.md
    acceptance_refs:
      - tests/unit/commands/task-complete.test.ts
      - docs/review-contract.md
    review_contract:
      version: 1
      mode: boundary
      stages:
        - stage: producer
          disposition: in_scope
          claim: >
            task complete produces an evidence verdict that names every
            declared entry and the recorded run that backs it.
          refs:
            - src/commands/task-complete.ts
        - stage: consumer
          disposition: in_scope
          claim: >
            The evidence checker reads the locked contract and the verification
            ledger, and treats an unreadable ledger as unproven rather than as
            satisfied.
          refs:
            - src/core/review-contract-evidence.ts
            - src/core/verification-ledger.ts
        - stage: runner
          disposition: in_scope
          claim: >
            task complete refuses with a structured envelope at exit 2 listing
            the unmet evidence ids and unproven required platforms.
          refs:
            - src/cli/commands/task.ts
        - stage: os
          disposition: not_applicable
          rationale: >
            The gate compares recorded runs against the declared matrix. It
            reads no platform API and changes no operating-system behavior; the
            platforms it reasons about are data, not the host it runs on.
        - stage: security
          disposition: in_scope
          claim: >
            The gate is fail-closed: a missing, unreadable, or stale ledger
            entry counts as unproven, so an unbacked claim can never complete a
            task.
          refs:
            - src/core/review-contract-evidence.ts
            - tests/integration/review-contract-evidence.test.ts
      platforms:
        - platform: linux
          disposition: required
          level: integration
          refs:
            - tests/integration/review-contract-evidence.test.ts
        - platform: macos
          disposition: not_required
          rationale: >
            The gate adds no macOS-specific behavior; it reads the same ledger
            records the Linux integration run already exercises.
        - platform: windows
          disposition: not_required
          rationale: >
            The gate adds no Windows-specific behavior; no path handling or
            process launch semantics are introduced.
      evidence:
        - id: evidence-backing
          claim: >
            A declared evidence entry with no recorded run is reported as
            unmet, and one with a matching run is reported as satisfied.
          level: unit
          refs:
            - tests/unit/core/review-contract-evidence.test.ts
        - id: required-platform-proof
          claim: >
            A required platform whose recorded proof is weaker than the
            declared level is reported as unproven.
          level: unit
          refs:
            - tests/unit/core/review-contract-evidence.test.ts
        - id: completion-refusal
          claim: >
            task complete refuses through a real CLI process when evidence is
            unmet, and records no done event.
          level: integration
          refs:
            - tests/integration/review-contract-evidence.test.ts
        - id: completion-error-surface
          claim: >
            The refusal is a registered public error code with a stable data
            shape carrying the unmet entries.
          level: unit
          refs:
            - tests/unit/commands/task-complete.test.ts
            - tests/unit/error-code-surface.test.ts
