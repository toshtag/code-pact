contract:
  description: >
    Introduce a versioned task-level review contract without activating the
    missing-contract lock refusal yet. Parse and validate supplied contracts,
    include them in task registration and immutable contract locks when present,
    detect post-lock drift, emit plan-lint diagnostics, provide an explicit
    task-authoring path, and generate valid contracts in shipped sample phases.
    Existing projects, historical tasks, historical locks, and existing test
    fixtures remain operational until P90-T0B performs migration and activates
    enforcement.
