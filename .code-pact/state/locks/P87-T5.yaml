    - tests/unit/commands/task-complete.test.ts
    - tests/unit/commands/verify.test.ts
    - tests/unit/core/verification-ledger.test.ts
    - tests/unit/error-code-surface.test.ts
  definition_of_done:
    - A first full verification failure from task complete immediately returns
      the focused verify command
    - Adding, deleting, renaming, or changing an untracked file changes the
      verification-state digest
    - Agent JSON, normal JSON, and human output expose the same focused next
      action
    - Changing the contents of an existing untracked file invalidates the prior
      focused pass
    - Existing tracked-file behavior and policy-absent compatibility remain
      unchanged
    - Git state collection failure prevents focused/full authorization
    - Local verification requires a successful focused run before full
      verification and bounds full-suite attempts to two
    - Main commits run one full standard gate
    - Publish reuses the successful exact-SHA main CI result
    - Publish workflow does not depend on ambient git identity
    - Pull-request CI executes the generated focused plan while high-risk
      changes and main pushes retain one full gate
    - Pull-request verification uses deterministic focused selection with full
      fallback
    - Supply-chain invariants enforce the release contract
    - The failure output never recommends task complete again before a new
      focused pass
    - Trusted publishing fails closed on existing-version collisions
    - Untracked symlinks are hashed without reading through them outside the
      repository
    - Verification processes are bounded and expose heartbeat and slowest-file
      output
    - npm provenance attestation is verified before GitHub Release creation
  verification_commands:
    - git diff --check
    - pnpm build
    - pnpm check:docs
    - pnpm check:supply-chain
    - pnpm test:integration:smoke -- --no-file-parallelism --testTimeout=30000
    - pnpm test:unit -- --no-file-parallelism --testTimeout=30000
    - pnpm typecheck
