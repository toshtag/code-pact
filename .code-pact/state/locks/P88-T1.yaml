contract:
  description: >
    Right-size the generated claude-code bootstrap. Introduce an
    adapter-schema-v2 instruction contract whose checks require the
    progressive-disclosure entrypoint and a bounded bootstrap context budget,
    and whose checks reject the lifecycle enumeration, failure catalog, and
    model selection guidance that the schema-v1 contract requires. Generate the
    claude-code instruction file against that contract, bump the claude-code
    adapter to schema version 2, and add the Claude 5 model ids to the model
    catalog without branching the template on model version.
