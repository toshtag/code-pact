  definition_of_done:
    - Adapter conformance selects its instruction-file contract from the
      manifest adapter schema version, so schema-v1 installs keep the existing
      checks
    - The Claude model catalog carries the Claude 5 model ids for validation,
      profile seeding, and advisory defaults
    - The claude-code adapter declares adapter schema version 2
    - The generated claude-code instruction file enumerates no lifecycle verb
      set, no failure catalog, and no model selection guidance
    - The generated claude-code instruction file is identical for every
      supported Claude model version
    - The generated claude-code instruction file presents `task prepare` as the
      per-task entrypoint and names the progressive-disclosure fields the agent
      reads from it
    - The generated claude-code instruction file stays within the bootstrap
      context budget
    - The repository-gotcha section of the generated claude-code instruction
      file is bounded
