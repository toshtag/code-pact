    - src/core/process/bounded-command.ts
    - src/core/verify/classify.ts
    - tests/unit/core/bounded-command-argv.test.ts
    - tests/unit/core/verify/classify.test.ts
  depends_on:
    - P89-T1A
  decision_refs: []
  acceptance_refs:
    - tests/unit/core/bounded-command-argv.test.ts
    - tests/unit/core/verify/classify.test.ts
  definition_of_done:
    - Bounded-process tests do not depend on shared-runner wall-clock ceilings
    - CI assertion failures identify the exact test and assertion
    - Classifier commands execute as their canonical argv, so no argument or
      changed-file path is re-interpreted by a shell
    - Phase status mutation preserves every non-target source byte
    - The verification command contract is validated at the producer-consumer
      boundary, so review-bundle and ci-parity run the classifier commands the
      scope script actually emits
  verification_commands:
    - git diff --check
    - pnpm build
    - pnpm check:docs
    - pnpm exec vitest run
