contract:
  description: >
    Execute verification-scope commands as their canonical flat argv without
    reconstructing a shell command. P89-T1A validated the argv at the parse
    boundary but the runner still rebuilt a shell line from it, and JSON quoting
    is not shell escaping: a changed-file path or argument carrying shell syntax
    was re-interpreted rather than passed through. Preserve timeout,
    cancellation, bounded-output, and process-tree termination behavior, and
    keep the rendered command string for manifests and diagnostics only.
  reads:
    - src/core/process/bounded-command.ts
    - src/core/verify/classify.ts
    - tests/integration/ci-parity.test.ts
    - tests/integration/review-bundle.test.ts
    - tests/unit/commands/verify-process.test.ts
    - tests/unit/core/verify/classify.test.ts
  writes:
