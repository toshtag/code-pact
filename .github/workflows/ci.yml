name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Classify change scope
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.classify.outputs.docs }}
      standard: ${{ steps.classify.outputs.standard }}
      fallback_full: ${{ steps.classify.outputs.fallback_full }}
      mode: ${{ steps.classify.outputs.mode }}
      fallback_reason: ${{ steps.classify.outputs.fallback_reason }}
      plan_json: ${{ steps.classify.outputs.plan_json }}
      base_ref: ${{ steps.base.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine base ref
        id: base
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Classify changed files
        id: classify
        env:
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: |
          trusted_root="$RUNNER_TEMP/trusted-classifier"
          trusted_classifier="$trusted_root/scripts/verification-scope.mjs"
          if git cat-file -e "$BASE_REF:scripts/verification-scope.mjs" 2>/dev/null; then
            mkdir -p "$trusted_root/scripts/lib"
            git show "$BASE_REF:scripts/verification-scope.mjs" > "$trusted_classifier"
            git show "$BASE_REF:scripts/lib/run-bounded-process.mjs" > "$trusted_root/scripts/lib/run-bounded-process.mjs"

            node "$trusted_classifier" --base "$BASE_REF" --plan > "$RUNNER_TEMP/verification-plan.json"
            node "$trusted_classifier" --base "$BASE_REF" --format github

            # Older base classifiers do not emit fallback_full. Default to true
            # (full gate) so downstream jobs always see a valid boolean.
            if ! grep -q '^fallback_full=' "$GITHUB_OUTPUT" 2>/dev/null; then
              echo "fallback_full=true" >> "$GITHUB_OUTPUT"
            fi
            if ! grep -q '^mode=' "$GITHUB_OUTPUT" 2>/dev/null; then
              mode=$(node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(p.mode)' "$RUNNER_TEMP/verification-plan.json")
              echo "mode=$mode" >> "$GITHUB_OUTPUT"
            fi
            if ! grep -q '^fallback_reason=' "$GITHUB_OUTPUT" 2>/dev/null; then
              fallback_reason=$(node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(p.fallback_full ? "legacy_trusted_classifier" : "")' "$RUNNER_TEMP/verification-plan.json")
              echo "fallback_reason=$fallback_reason" >> "$GITHUB_OUTPUT"
            fi

            plan_json=$(base64 -w0 "$RUNNER_TEMP/verification-plan.json")
            echo "plan_json=$plan_json" >> "$GITHUB_OUTPUT"
          else
            echo "docs=true" >> "$GITHUB_OUTPUT"
            echo "standard=true" >> "$GITHUB_OUTPUT"
            echo "fallback_full=true" >> "$GITHUB_OUTPUT"
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "fallback_reason=classifier_unavailable" >> "$GITHUB_OUTPUT"
          fi

  docs:
    name: Docs checks
    runs-on: ubuntu-latest
    needs: [classify]
    if: >
      github.event_name == 'pull_request' &&
      needs.classify.outputs.docs == 'true' &&
      needs.classify.outputs.standard != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check:docs

  standard:
    name: Standard gate (Node 22)
    runs-on: ubuntu-latest
    needs: [classify]
    if: >
      github.event_name == 'push' ||
      needs.classify.outputs.standard == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run bounded verification plan
        env:
          BASE_REF: ${{ needs.classify.outputs.base_ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          plan_json="${{ needs.classify.outputs.plan_json }}"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            node scripts/verification-scope.mjs --base "$BASE_REF" --force-full --run
          elif git cat-file -e "$BASE_REF:scripts/verification-scope.mjs" 2>/dev/null; then
            trusted_root="$RUNNER_TEMP/trusted-verification"
            trusted_classifier="$trusted_root/scripts/verification-scope.mjs"
            mkdir -p "$trusted_root/scripts/lib"
            git show "$BASE_REF:scripts/verification-scope.mjs" > "$trusted_classifier"
            git show "$BASE_REF:scripts/lib/run-bounded-process.mjs" > "$trusted_root/scripts/lib/run-bounded-process.mjs"

            if [ -n "$plan_json" ]; then
              echo "$plan_json" | base64 -d > "$RUNNER_TEMP/classify-verification-plan.json"
              node "$trusted_classifier" --base "$BASE_REF" --plan > "$RUNNER_TEMP/standard-verification-plan.json"
              classify_digest=$(sha256sum "$RUNNER_TEMP/classify-verification-plan.json" | cut -d ' ' -f1)
              standard_digest=$(sha256sum "$RUNNER_TEMP/standard-verification-plan.json" | cut -d ' ' -f1)
              if [ "$classify_digest" != "$standard_digest" ]; then
                echo "trusted verification plan digest mismatch: classify=$classify_digest standard=$standard_digest"
                exit 1
              fi
            fi

            node "$trusted_classifier" --base "$BASE_REF" --run
          else
            pnpm check:supply-chain
            pnpm typecheck
            pnpm test:unit -- --no-file-parallelism --testTimeout=30000
            pnpm build
            pnpm test:integration:smoke -- --no-file-parallelism --testTimeout=30000
            node --version
          fi

      - name: Run filesystem security invariants
        run: |
          pnpm check:fs-containment
          # check:security-hardening internally executes the global
          # check:fs-authority gate; do not run it twice here.
          pnpm check:security-hardening

  ci-status:
    name: CI status
    runs-on: ubuntu-latest
    needs: [classify, docs, standard]
    if: ${{ always() }}
    steps:
      - name: Verify CI results
        env:
          DOCS_OUTPUT: ${{ needs.classify.outputs.docs }}
          STANDARD_OUTPUT: ${{ needs.classify.outputs.standard }}
          FALLBACK_FULL_OUTPUT: ${{ needs.classify.outputs.fallback_full }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          STANDARD_RESULT: ${{ needs.standard.result }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          for output in docs standard fallback_full; do
            value="${DOCS_OUTPUT:-unknown}"
            if [ "$output" = "standard" ]; then value="${STANDARD_OUTPUT:-unknown}"; fi
            if [ "$output" = "fallback_full" ]; then value="${FALLBACK_FULL_OUTPUT:-unknown}"; fi
            if [ "$value" != "true" ] && [ "$value" != "false" ]; then
              echo "classify output '$output' is not a boolean: '$value'"
              exit 1
            fi
          done
          if [ "$CLASSIFY_RESULT" != "success" ]; then
            echo "classify job did not succeed: $CLASSIFY_RESULT"
            exit 1
          fi
          if [ "$DOCS_OUTPUT" = "true" ] && [ "$DOCS_RESULT" != "success" ] && [ "$STANDARD_RESULT" != "success" ]; then
            echo "docs job did not succeed and was not covered by standard gate: docs=$DOCS_RESULT"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$STANDARD_OUTPUT" = "true" ]; then
            if [ "$STANDARD_RESULT" != "success" ]; then
              echo "standard job did not succeed: standard=$STANDARD_RESULT"
              exit 1
            fi
          fi
