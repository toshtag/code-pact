name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Classify change scope
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.classify.outputs.docs }}
      standard: ${{ steps.classify.outputs.standard }}
      fallback_full: ${{ steps.classify.outputs.fallback_full }}
      base_ref: ${{ steps.base.outputs.ref }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine base ref
        id: base
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Classify changed files
        id: classify
        env:
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: |
          trusted_root="$RUNNER_TEMP/trusted-classifier"
          trusted_classifier="$trusted_root/scripts/verification-scope.mjs"
          if git cat-file -e "$BASE_REF:scripts/verification-scope.mjs" 2>/dev/null; then
            mkdir -p "$trusted_root/scripts/lib"
            git show "$BASE_REF:scripts/verification-scope.mjs" > "$trusted_classifier"
            git show "$BASE_REF:scripts/lib/run-bounded-process.mjs" > "$trusted_root/scripts/lib/run-bounded-process.mjs"
            node "$trusted_classifier" --base "$BASE_REF" --format github
          else
            echo "docs=true" >> "$GITHUB_OUTPUT"
            echo "standard=true" >> "$GITHUB_OUTPUT"
            echo "fallback_full=true" >> "$GITHUB_OUTPUT"
          fi

  docs:
    name: Docs checks
    runs-on: ubuntu-latest
    needs: [classify]
    if: needs.classify.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check:docs

  standard:
    name: Standard gate (Node 22)
    runs-on: ubuntu-latest
    needs: [classify]
    if: >
      github.event_name == 'push' ||
      needs.classify.outputs.standard == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run bounded verification plan
        env:
          BASE_REF: ${{ needs.classify.outputs.base_ref }}
          FALLBACK_FULL: ${{ needs.classify.outputs.fallback_full }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ "$FALLBACK_FULL" = "true" ] || [ "$GITHUB_EVENT_NAME" = "push" ]; then
            pnpm check:supply-chain
            pnpm typecheck
            pnpm test:unit -- --no-file-parallelism --testTimeout=30000
            pnpm build
            pnpm test:integration:smoke -- --no-file-parallelism --testTimeout=30000
            node dist/cli.js --version
            node dist/cli.js --json --version
          else
            node scripts/verification-scope.mjs --base "$BASE_REF" --run
          fi

  ci-status:
    name: CI status
    runs-on: ubuntu-latest
    needs: [classify, docs, standard]
    if: ${{ always() }}
    steps:
      - name: Verify CI results
        env:
          DOCS_OUTPUT: ${{ needs.classify.outputs.docs }}
          STANDARD_OUTPUT: ${{ needs.classify.outputs.standard }}
          FALLBACK_FULL_OUTPUT: ${{ needs.classify.outputs.fallback_full }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          STANDARD_RESULT: ${{ needs.standard.result }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          for output in docs standard fallback_full; do
            value="${DOCS_OUTPUT:-unknown}"
            if [ "$output" = "standard" ]; then value="${STANDARD_OUTPUT:-unknown}"; fi
            if [ "$output" = "fallback_full" ]; then value="${FALLBACK_FULL_OUTPUT:-unknown}"; fi
            if [ "$value" != "true" ] && [ "$value" != "false" ]; then
              echo "classify output '$output' is not a boolean: '$value'"
              exit 1
            fi
          done
          if [ "$CLASSIFY_RESULT" != "success" ]; then
            echo "classify job did not succeed: $CLASSIFY_RESULT"
            exit 1
          fi
          if [ "$DOCS_OUTPUT" = "true" ] && [ "$DOCS_RESULT" != "success" ]; then
            echo "docs job did not succeed: docs=$DOCS_RESULT"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$STANDARD_OUTPUT" = "true" ]; then
            if [ "$STANDARD_RESULT" != "success" ]; then
              echo "standard job did not succeed: standard=$STANDARD_RESULT"
              exit 1
            fi
          fi
